<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232B1D14'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23F5C451' font-family='Georgia,serif' font-weight='700'%3ET%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Carta (prototipo libro) · Café Tramuntana</title>
<meta name="theme-color" content="#F7F7F4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Instrument+Sans:wght@400;500;600&family=Sacramento&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#F7F7F4; --espresso:#FFFFFF; --roast:#DCD9D1; --nogal:#2B1D14;
  --copper:#F5C451; --copper-soft:#8B5A2B;
  --cream:#2B1D14; --foam:#5E4E42; --foam-hi:#5E4E42;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Instrument Sans',system-ui,sans-serif;
  --script:'Sacramento','Brush Script MT',cursive;
  --cw:min(88vw,430px);           /* ancho de cada tarjeta */
  --gap:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(rgba(247,247,244,.55),rgba(247,247,244,.55)),url(fondo-carta.jpg) center top/300px 300px repeat,var(--ink);
  color:var(--cream);font-family:var(--sans);font-size:.94rem;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #8B5A2B;outline-offset:3px}

/* ---------- Barra superior ---------- */
.bar{flex:none;position:relative;z-index:8;background:rgba(247,247,244,.9);padding:calc(1.45rem + env(safe-area-inset-top)) 1rem .6rem;display:grid;grid-template-columns:2.5rem 1fr 2.5rem;align-items:center}
.icon-btn{width:2.5rem;height:2.5rem;display:grid;place-items:center;border-radius:50%;text-decoration:none;color:var(--foam);background:rgba(255,255,255,.7);border:1px solid var(--roast);transition:color .2s,border-color .2s}
.icon-btn:hover{color:var(--cream);border-color:var(--copper-soft)}
.icon-btn svg{width:20px;height:20px}

.count{justify-self:end;font-size:.76rem;font-weight:600;color:var(--foam);font-variant-numeric:tabular-nums}


/* Productos */
.items{list-style:none;display:grid;gap:.85rem}
.item-head{display:flex;align-items:baseline;gap:.45rem}
.item-name{font-weight:600;font-size:.92rem;line-height:1.3}
.dots{flex:1;min-width:.75rem;border-bottom:1.5px dotted rgba(139,90,43,.45);transform:translateY(-.25rem)}
.price{font-family:var(--sans);font-weight:600;font-size:1rem;color:var(--copper-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.desc{color:var(--foam-hi);font-size:.79rem;line-height:1.45;margin-top:.12rem}
.is-star{border:1px solid var(--copper);border-radius:16px;padding:.75rem .85rem;margin:0 -.2rem;background:radial-gradient(circle at 100% 0%,rgba(233,169,44,.22),transparent 60%)}
.star-tag{display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:600;color:var(--copper-soft);margin-bottom:.2rem}
.star-tag svg{width:12px;height:12px}
.is-star .item-name{font-family:var(--serif);font-size:1.08rem}
.is-star .dots{display:none}
.is-star .item-head{justify-content:space-between}
.is-star .price{font-size:1.15rem}


/* ---------- Pista de uso (primera visita) ---------- */
.hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;display:grid;gap:.5rem;padding:.9rem 1.25rem;border-radius:18px;background:rgba(247,247,244,.96);border:1px solid var(--copper);box-shadow:0 10px 30px rgba(43,29,20,.22);font-size:.88rem;font-weight:500;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .4s}
.hint.show{opacity:1}
.hint div{display:flex;align-items:center;gap:.55rem}
.hint svg{width:20px;height:20px;color:var(--copper-soft);flex:none}


/* Nombre del local como el neón de la pared */
.brand,.neon{font-family:var(--script);font-weight:400;color:#E9A92C;text-shadow:0 0 1px #fff7da,0 0 6px rgba(255,176,46,.9),0 0 18px rgba(255,176,46,.55),0 0 36px rgba(255,176,46,.35)}


/* ===================== Letrero colgado (igual que en la portada, en pequeño) ===================== */
.colgante{position:relative;justify-self:center;animation:caer 1.3s .1s both}
.pendulo{position:relative;transform-origin:50% -1.7rem;animation:balanceo 2.8s .1s both}
.hilo{position:absolute;bottom:calc(100% + 8px);width:1.5px;height:140px;border-radius:1px;background:linear-gradient(90deg,#8d867d,#4a4038 55%,#2b1d14);box-shadow:1px 0 2px rgba(43,29,20,.25)}
.hilo-i{left:calc(.7rem + 3px)}.hilo-d{right:calc(.7rem + 3px)}
.panel{position:relative;padding:.5rem 1.15rem;border-radius:10px;
  background:linear-gradient(140deg,rgba(255,255,255,.75),rgba(255,255,255,.22) 55%,rgba(43,29,20,.07));
  border:1px solid rgba(43,29,20,.22);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),inset 0 1px 4px rgba(255,255,255,.65),
    0 2px 0 #cdc8be,0 3px 1px rgba(43,29,20,.3),0 6px 9px -3px rgba(43,29,20,.3),9px 16px 22px -9px rgba(43,29,20,.32)}
.panel::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(112deg,transparent 22%,rgba(255,255,255,.5) 30%,rgba(255,255,255,.08) 38%,transparent 44%)}
/* Tubo de neón: núcleo claro, borde ámbar, halo y sombra sobre el panel */
.bar .brand{position:relative;margin:0;font-family:var(--script);font-size:2.15rem;line-height:1;text-align:center;
  color:#ffe39a;-webkit-text-stroke:.022em #f39a12;paint-order:stroke fill;
  text-shadow:0 0 2px rgba(255,214,120,.9),0 0 6px rgba(255,176,46,.75),0 0 12px rgba(255,176,46,.28),2px 5px 4px rgba(43,29,20,.32);
  animation:parpadeo 2.1s 1.1s both}
.madera{position:absolute;top:-17px;z-index:4;width:10px;height:29px;overflow:visible;pointer-events:none;
  filter:drop-shadow(1.5px 3px 2px rgba(43,29,20,.5)) drop-shadow(0 1px 0 rgba(43,29,20,.3))}
.madera.mi{left:calc(.7rem - 2px)}.madera.md{right:calc(.7rem - 2px)}
@keyframes caer{
  0%{transform:translateY(-130px);animation-timing-function:cubic-bezier(.5,0,.9,.6)}
  52%{transform:translateY(0);animation-timing-function:ease-out}
  66%{transform:translateY(-7px);animation-timing-function:ease-in}
  78%{transform:translateY(0);animation-timing-function:ease-out}
  88%{transform:translateY(-1.5px);animation-timing-function:ease-in-out}
  100%{transform:translateY(0)}
}
@keyframes balanceo{
  0%{transform:rotate(-4deg)}20%{transform:rotate(3deg)}40%{transform:rotate(-2.4deg)}
  55%{transform:rotate(1.8deg)}70%{transform:rotate(-1.1deg)}83%{transform:rotate(.6deg)}93%{transform:rotate(-.2deg)}100%{transform:rotate(0)}
}
@keyframes parpadeo{
  0%,7%,14%,21%,29%,36%{color:#e9e4d6;-webkit-text-stroke-color:#bdb5a2;text-shadow:2px 5px 4px rgba(43,29,20,.3)}
  9%,12%{color:#ffeab0;-webkit-text-stroke-color:#d49a3a;text-shadow:0 0 4px rgba(255,176,46,.7),2px 5px 4px rgba(43,29,20,.3)}
  23%,27%,64%,67%{color:#ffe7a8;-webkit-text-stroke-color:#e89a22;text-shadow:0 0 2px rgba(255,214,120,.75),0 0 8px rgba(255,176,46,.4),2px 5px 4px rgba(43,29,20,.32)}
  38%,60%,70%,100%{color:#ffe39a;-webkit-text-stroke-color:#f39a12;text-shadow:0 0 2px rgba(255,214,120,.9),0 0 6px rgba(255,176,46,.75),0 0 12px rgba(255,176,46,.28),2px 5px 4px rgba(43,29,20,.32)}
}



/* ===================== EL LIBRO ===================== */
:root{--papel:#fdfbf4;--papel-2:#f6f1e3;--tinta-borde:#e4dccb}
:root,html,body{overscroll-behavior:none}
.libro{touch-action:pan-y pinch-zoom}
.escena{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;perspective:2600px;padding:1.1rem .7rem 1.2rem}
.libro{position:relative;width:calc(var(--pl) + var(--pr));height:100%;max-height:780px;transform-style:preserve-3d}
/* Tapa del libro: cuero oscuro con filo dorado, asoma por los bordes de las páginas */
.libro::before{content:"";position:absolute;inset:-9px -9px -12px;border-radius:12px;transform:translateZ(-3px);
  background:linear-gradient(135deg,#43301f,#2B1D14 55%,#1d130c);
  box-shadow:inset 0 0 0 1.5px rgba(245,196,81,.4),0 26px 44px -14px rgba(43,29,20,.6),0 6px 12px rgba(43,29,20,.3)}
.base{position:absolute;top:0;height:100%;background:var(--papel);overflow:hidden;translate:0 0 -2px}
.base.izq{display:none;width:var(--pl)}
.base.der{left:0;width:var(--pr);border-radius:2px 8px 8px 2px;
  box-shadow:1px 0 0 #e6dfce,2px 0 0 #fff,3px 0 0 #ddd5c3,4px 0 0 #fff,5px 1px 0 #d3cab6}
.hoja{position:absolute;top:0;left:0;width:var(--pr);height:100%;transform-origin:left center;transform-style:preserve-3d;
  transition:transform .95s cubic-bezier(.45,.05,.25,1)}
.hoja.girada{transform:rotateY(-180deg)}
.sin-anim .hoja{transition:none!important}
.cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:linear-gradient(180deg,#fffdf8,var(--papel) 40%,#faf5e8)}
.cara.frente{border-radius:2px 8px 8px 2px}
.cara.atras{transform:rotateY(180deg);border-radius:8px 2px 2px 8px;right:auto;width:var(--pb)}
/* sombra del lomo y desvanecido al pie para indicar que se puede bajar */
.cara.frente::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;background:linear-gradient(90deg,rgba(43,29,20,.2),rgba(43,29,20,0) 8%)}
.cara.atras::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;background:linear-gradient(270deg,rgba(43,29,20,.2),rgba(43,29,20,0) 8%)}
.cara::before{content:"";position:absolute;left:0;right:0;bottom:2.4rem;height:2.2rem;pointer-events:none;z-index:5;background:linear-gradient(0deg,#faf5e8,rgba(250,245,232,0))}
.pag{position:absolute;inset:0}
.folio{position:absolute;z-index:7;bottom:0;left:0;right:0;height:2.4rem;line-height:2.4rem;text-align:center;font-family:var(--serif);font-size:.95rem;color:var(--copper-soft);pointer-events:none;background:#faf5e8;border-top:1px solid var(--tinta-borde)}

/* ---- página de productos ---- */
.desplaza{position:absolute;inset:0 0 2.4rem 0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;padding:0 1.35rem 1.6rem 1.7rem;-webkit-overflow-scrolling:touch}
.desplaza::-webkit-scrollbar{display:none}
.desplaza:focus-visible{outline:2px solid var(--copper-soft);outline-offset:-3px}
.cabecera-pag{display:none}
.hero-movil{position:relative;margin:0 -1.35rem 0 -1.7rem;height:190px;background:linear-gradient(135deg,var(--roast),var(--ink))}
.hero-movil img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-movil::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(247,247,244,0) 30%,#fdfbf4 100%)}
.hero-movil .t{position:absolute;z-index:1;left:1.7rem;right:1.35rem;bottom:.6rem}
.hero-movil h2{font-family:var(--serif);font-weight:700;font-size:1.9rem;line-height:1.05}
.cuando{display:inline-block;font-size:.7rem;font-weight:600;color:var(--nogal);background:var(--copper);padding:.18rem .6rem;border-radius:99px;margin-bottom:.4rem}
.lead{color:var(--foam);font-size:.84rem;margin:.5rem 0 .2rem}
.grupo{margin-top:1.3rem}
.grupo h3{font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.55rem;line-height:1.15;color:var(--copper-soft);padding-bottom:.35rem;margin-bottom:.8rem;border-bottom:1px solid var(--tinta-borde)}
.legal{margin-top:1.8rem;color:var(--foam);font-size:.74rem}
.legal a{color:var(--foam)}
.is-star{border:2px solid #f39a12;border-radius:16px;padding:.75rem .85rem;margin:0 -.2rem;background:radial-gradient(circle at 100% 0%,rgba(233,169,44,.2),transparent 60%);
  box-shadow:inset 0 0 0 1px #ffe39a,0 0 0 1px rgba(255,214,120,.45),0 0 10px rgba(255,176,46,.35)}

/* ---- página de foto (la de la izquierda del libro) ---- */
.cara.atras .foto,.base.izq .foto{border-radius:8px 2px 0 0}
.foto{position:absolute;left:0;right:0;top:0;height:62%;background:linear-gradient(135deg,var(--roast),var(--ink))}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(253,251,244,0) 55%,#fdfbf4 100%)}
.foto-texto{position:absolute;left:1.4rem;right:1.2rem;bottom:3.4rem;z-index:2}
.foto-texto h2{font-family:var(--serif);font-weight:700;font-size:clamp(1.7rem,2.5vw,2.3rem);line-height:1.08;margin-bottom:.5rem;text-wrap:balance}
.foto-texto .lead{font-size:.86rem;max-width:30ch}
.fin{display:grid;place-content:center;gap:.9rem;text-align:center;padding:2rem;height:100%}
.fin .neon{font-size:3rem;line-height:1}
.fin p{color:var(--foam);font-size:.9rem}

/* ---- pestañas, flechas ---- */
.pestanas{flex:none;display:flex;justify-content:center;gap:.4rem;padding:.55rem .6rem calc(.75rem + env(safe-area-inset-bottom));position:relative;z-index:8}
.pest{font:inherit;font-weight:600;font-size:.8rem;padding:.5rem .8rem;border-radius:99px;border:1.5px solid var(--roast);background:rgba(255,255,255,.85);color:var(--foam);cursor:pointer;transition:background .25s,box-shadow .25s,color .25s,border-color .25s}
.pest[aria-current="true"]{background:var(--copper);border-color:#f39a12;color:var(--nogal);box-shadow:0 0 12px rgba(255,176,46,.55)}
.pest:hover{border-color:var(--copper-soft)}
.pasar{display:none}

/* ---- móvil: una sola página a la vez ---- */
@media (max-width:819px){
  :root{--pl:0px;--pr:min(calc(100vw - 1.4rem),540px);--pb:var(--pr)}
  .escena{padding:.8rem .7rem .3rem;overflow:hidden}
  .hoja{transition:transform .95s cubic-bezier(.45,.05,.25,1),visibility 0s}
  .hoja.girada{visibility:hidden;transition:transform .95s cubic-bezier(.45,.05,.25,1),visibility 0s .95s}
  .sin-anim .hoja.girada{visibility:hidden}
  .libro::before{inset:-7px -7px -9px}
  .desplaza{padding:0 1.05rem 1.2rem 1.2rem}
  .hero-movil{margin:0 -1.05rem 0 -1.2rem;height:112px}
  .hero-movil .t{left:1.2rem;right:1.05rem;bottom:.4rem}
  .hero-movil h2{font-size:1.5rem}
  .hero-movil .cuando{margin-bottom:.25rem}
  .lead.solo-movil{font-size:.8rem;margin:.35rem 0 0}
  .grupo{margin-top:.9rem}
  .grupo h3{font-size:1.4rem;margin-bottom:.6rem}
  .foto-texto .lead{max-width:none}
  .pestanas{gap:.3rem;padding:.4rem .4rem calc(.6rem + env(safe-area-inset-bottom))}
  .pest{padding:.42rem .62rem;font-size:.78rem}
}
/* ---- escritorio: libro abierto a dos páginas ---- */
@media (min-width:820px){
  :root{--pl:min(27vw,340px);--pr:min(46vw,640px);--pb:var(--pl)}
  .libro::before{inset:-14px -14px -18px}
  .base.izq{display:block;left:0;border-radius:8px 2px 2px 8px;
    box-shadow:-1px 0 0 #e6dfce,-2px 0 0 #fff,-3px 0 0 #ddd5c3,-4px 0 0 #fff,-5px 1px 0 #d3cab6}
  .base.izq::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;background:linear-gradient(270deg,rgba(43,29,20,.2),rgba(43,29,20,0) 8%)}
  .base.der{left:var(--pl)}
  .hoja{left:var(--pl)}
  .hero-movil,.lead.solo-movil{display:none}
  .cabecera-pag{display:block;font-family:var(--serif);font-style:italic;font-size:1rem;color:var(--foam);padding:1.4rem 0 .2rem}
  .desplaza{padding-top:0}
  .pasar{display:grid;place-items:center;position:absolute;top:50%;margin-top:-1.6rem;z-index:15;width:3.2rem;height:3.2rem;border-radius:50%;border:1px solid var(--roast);background:rgba(255,255,255,.92);color:var(--cream);cursor:pointer;transition:background .2s,opacity .2s}
  .pasar:hover{background:var(--copper)}
  .pasar:disabled{opacity:0;pointer-events:none}
  .pasar svg{width:22px;height:22px}
  .pasar.ant{left:calc(50% - (var(--pl) + var(--pr))/2 - 4.8rem)}
  .pasar.sig{right:calc(50% - (var(--pl) + var(--pr))/2 - 4.8rem)}
}
@media (prefers-reduced-motion:reduce){
  .hoja{transition:none}
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>

  </a>
  <div class="colgante"><div class="pendulo">
    <span class="hilo hilo-i" aria-hidden="true"></span><span class="hilo hilo-d" aria-hidden="true"></span>
    <div class="panel">
      <svg class="madera mi" viewBox="0 0 20 56" aria-hidden="true">
            <defs>
              <linearGradient id="cmwi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcae70"/><stop offset=".55" stop-color="#bf8845"/><stop offset="1" stop-color="#a06f35"/></linearGradient>
              <linearGradient id="cmsi" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff0cc" stop-opacity=".55"/><stop offset=".3" stop-color="#fff0cc" stop-opacity="0"/><stop offset=".62" stop-color="#3c1e08" stop-opacity="0"/><stop offset="1" stop-color="#3c1e08" stop-opacity=".45"/></linearGradient>
              <linearGradient id="cmmi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f2ee"/><stop offset=".45" stop-color="#a29d95"/><stop offset="1" stop-color="#5f5a53"/></linearGradient>
            </defs>

            <path d="M5.5 1.5H14.5Q17.5 1.5 17.5 5V11Q17.5 15 14 20Q15.3 27 17.5 40L17.8 52.5Q17.8 54.5 15.8 54.5H4.2Q2.2 54.5 2.2 52.5L2.5 40Q4.7 27 6 20Q2.5 15 2.5 11V5Q2.5 1.5 5.5 1.5Z" fill="url(#cmsi)"/>
            <g fill="none" stroke="#5a320f" stroke-opacity=".38" stroke-width=".35" stroke-linecap="round">
              <path d="M5.2 4Q4.8 20 6.4 40"/><path d="M7.6 6Q7.3 28 8 52"/><path d="M12.4 5Q12.8 24 11.9 46"/><path d="M14.8 8Q15.3 28 14.6 50"/>
            </g>
            <path d="M9.5 21.5H10.5L10.8 54.5H9.2Z" fill="#2a1507" fill-opacity=".85"/>
            <path d="M4 40L3.6 52.5M16 40L16.4 52.5" stroke="#fff0cc" stroke-opacity=".35" stroke-width=".5" fill="none"/>
            <rect x=".8" y="19" width="18.4" height="7" rx="3.2" fill="url(#cmmi)" stroke="#3f3b36" stroke-opacity=".7" stroke-width=".5"/>
            <path d="M4 19.4L5.6 25.6M7.6 19.4L9.2 25.6M10.8 19.4L12.4 25.6M14.4 19.4L16 25.6" stroke="#3f3b36" stroke-opacity=".45" stroke-width=".5"/>
            <path d="M2.6 20.4H17.4" stroke="#fff" stroke-opacity=".75" stroke-width=".6" stroke-linecap="round"/>
          </svg>
      <svg class="madera md" viewBox="0 0 20 56" aria-hidden="true">
            <defs>

<script>
function bootCarta(){
  var libro=document.getElementById('libro'),pest=document.getElementById('pestanas'),countEl=document.getElementById('count'),
      prevB=document.getElementById('ant'),nextB=document.getElementById('sig'),
      reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches,
      N=MENU.length,cur=0,hojas=[],tabs=[],t0=Date.now(),listo=false;
  var STAR='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>';
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function tarde(){return Date.now()-t0>1800}
  function sabeUsarla(){try{localStorage.setItem('tr-carta-sabe','1')}catch(e){}}
  function corto(c){var m={cafes:'Cafés',tapas:'Tapas',bocadillos:'Bocatas',cervezas:'Cervezas',cocteles:'Cócteles'};return m[c.id]||c.title.split(/[ &]/)[0]}

  function itemNode(it){
    var li=el('li',it[3]?'is-star':null);
    if(it[3]){var t=el('span','star-tag');t.innerHTML=STAR;t.appendChild(document.createTextNode('La estrella de la casa'));li.appendChild(t)}
    var h=el('div','item-head');h.appendChild(el('span','item-name',it[0]));h.appendChild(el('span','dots'));h.appendChild(el('span','price',it[1]));li.appendChild(h);
    if(it[2])li.appendChild(el('p','desc',it[2]));
    return li;
  }
  function imagen(c,i){if(!c.photo)return null;var im=el('img');im.alt='';im.src=c.photo;im.onerror=function(){im.remove()};return im}

  /* página de la izquierda: foto y título de la categoría */
  function fotoPagina(i){
    var c=MENU[i],d=el('div','pag'),f=el('div','foto'),im=imagen(c,i);
    if(im)f.appendChild(im);d.appendChild(f);
    var t=el('div','foto-texto');if(c.when)t.appendChild(el('span','cuando',c.when));
    t.appendChild(el('h2',null,c.title));if(c.lead)t.appendChild(el('p','lead',c.lead));d.appendChild(t);
    d.appendChild(el('span','folio',String(2*i+1)));
    return d;
  }
  /* página de la derecha: todos los productos de la categoría, se baja con scroll normal */
  function itemsPagina(i){
    var c=MENU[i],d=el('div','pag'),sc=el('div','desplaza');sc.tabIndex=0;sc.setAttribute('aria-label',c.title);
    var hero=el('div','hero-movil'),im=imagen(c,i);if(im)hero.appendChild(im);
    var t=el('div','t');if(c.when)t.appendChild(el('span','cuando',c.when));t.appendChild(el('h2',null,c.title));hero.appendChild(t);sc.appendChild(hero);
    if(c.lead)sc.appendChild(el('p','lead solo-movil',c.lead));
    sc.appendChild(el('div','cabecera-pag',c.title));
    c.groups.forEach(function(g){
      var s=el('section','grupo');s.appendChild(el('h3',null,g.name));
      var ul=el('ul','items');g.items.forEach(function(it){ul.appendChild(itemNode(it))});s.appendChild(ul);sc.appendChild(s);
    });
    if(i===N-1){
      var lg=el('p','legal');
      lg.innerHTML='Precios con IVA incluido. Si tienes alguna alergia o intolerancia, avisa a nuestro equipo antes de pedir. <a href="legal.html">Aviso legal</a> · <a href="#" data-cookie-settings>Cookies</a>';
      sc.appendChild(lg);
    }
    d.appendChild(sc);d.appendChild(el('span','folio',String(2*i+2)));
    return d;
  }
  function finPagina(){
    var d=el('div','fin'),n=el('p','neon','Café Tramuntana');n.setAttribute('aria-hidden','true');
    d.appendChild(n);d.appendChild(el('p',null,'Gracias por venir. Av. de la Pau, 34, Ibi.'));return d;
  }

  /* ---- montar el libro ---- */
  var izq=el('div','base izq');izq.appendChild(fotoPagina(0));
  var der=el('div','base der');
  libro.appendChild(izq);libro.appendChild(der);
  MENU.forEach(function(c,i){
    var h=el('div','hoja'),fr=el('div','cara frente'),bk=el('div','cara atras');
    fr.appendChild(itemsPagina(i));bk.appendChild(i<N-1?fotoPagina(i+1):finPagina());
    h.appendChild(fr);h.appendChild(bk);libro.appendChild(h);hojas.push(h);
    var b=el('button','pest',corto(c));b.type='button';b.addEventListener('click',function(){ir(i)});pest.appendChild(b);tabs.push(b);
  });

  /* ---- pasar páginas ---- */
  /* Cada hoja queda a una profundidad distinta (décimas de píxel): arriba del montón, la última que se pasó o la primera que queda */
  function asentar(h,i,gira){h.style.zIndex=gira?i:100-i;h.style.translate='0 0 '+((gira?i:N-i)*0.5+0.5)+'px'}
  function ir(n){
    n=Math.max(0,Math.min(N-1,n));
    if(listo&&n===cur)return;
    if(listo&&tarde())sabeUsarla();
    var cambian=[];
    hojas.forEach(function(h,i){if((i<n)!==h.classList.contains('girada'))cambian.push(i)});
    if(n<cur)cambian.reverse();       /* al volver atrás, primero la más cercana */
    cur=n;
    hojas.forEach(function(h,i){
      var gira=i<cur,k=cambian.indexOf(i);
      h.querySelector('.frente').setAttribute('aria-hidden',gira?'true':'false');
      h.querySelector('.atras').setAttribute('aria-hidden',gira?'false':'true');
      if(k<0){if(!listo)asentar(h,i,gira);return}
      var retardo=(reduce||!listo)?0:k*130;
      h.style.transitionDelay=retardo+'ms';
      h.style.zIndex=300;h.style.translate='0 0 20px';   /* la que gira va por delante mientras se mueve */
      h.classList.toggle('girada',gira);
      setTimeout(function(){asentar(h,i,gira);h.style.transitionDelay='0ms'},(reduce||!listo)?0:retardo+980);
    });
    tabs.forEach(function(b,k){b.setAttribute('aria-current',k===cur?'true':'false')});
    countEl.textContent=(cur+1)+' / '+N;
    prevB.disabled=cur===0;nextB.disabled=cur===N-1;
    try{history.replaceState(null,'','#'+MENU[cur].id)}catch(e){}
  }
  prevB.addEventListener('click',function(){ir(cur-1)});
  nextB.addEventListener('click',function(){ir(cur+1)});
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){e.preventDefault();ir(cur+1)}
    else if(e.key==='ArrowLeft'){e.preventDefault();ir(cur-1)}
  });
  /* deslizar a los lados pasa la página; hacia abajo se desplaza la página con normalidad */
  var sx=0,sy=0,st=false;
  libro.addEventListener('touchstart',function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY;st=true},{passive:true});
  libro.addEventListener('touchend',function(e){
    if(!st)return;st=false;var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)ir(cur+(dx<0?1:-1));
  },{passive:true});

  /* ---- inicio: categoría del enlace (carta-libro.html#cervezas), sin animar ---- */
  var start=0,hash=location.hash.replace('#','');
  MENU.forEach(function(c,k){if(c.id===hash)start=k});
  ir(start);listo=true;
  requestAnimationFrame(function(){requestAnimationFrame(function(){libro.classList.remove('sin-anim')})});

  /* ---- explicación, solo a quien aún no sabe usarla ---- */
  var sabe=false;try{sabe=localStorage.getItem('tr-carta-sabe')==='1'}catch(e){}
  if(!sabe){
    var hint=document.getElementById('hint');
    setTimeout(function(){hint.classList.add('show')},800);
    var oculta=function(){hint.classList.remove('show');evs.forEach(function(ev){document.removeEventListener(ev,alMover)})};
    var evs=['touchmove','wheel','keydown'];
    function alMover(){setTimeout(oculta,250)}
    evs.forEach(function(ev){document.addEventListener(ev,alMover,{passive:true})});
    setTimeout(oculta,12000);
  }

  /* ---- logo centrado con la fuente real del navegador (igual que en la carta) ---- */
  function centrarLogo(){
    var b=document.querySelector('.bar .brand');if(!b)return;
    var cs=getComputedStyle(b),c=document.createElement('canvas').getContext('2d');
    c.font=cs.fontStyle+' '+cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
    var m=c.measureText(b.textContent.trim()),fs=parseFloat(cs.fontSize),dx=0,dy=0;
    if(m.actualBoundingBoxAscent!=null){
      dx=m.width/2-(m.actualBoundingBoxRight-m.actualBoundingBoxLeft)/2;
      if(m.fontBoundingBoxAscent!=null){
        var base=(fs-(m.fontBoundingBoxAscent+m.fontBoundingBoxDescent))/2+m.fontBoundingBoxAscent;
        dy=fs/2-(base+(m.actualBoundingBoxDescent-m.actualBoundingBoxAscent)/2);
      }
    }
    b.style.transform='translate('+dx.toFixed(2)+'px,'+dy.toFixed(2)+'px)';
  }
  centrarLogo();
  if(document.fonts){
    if(document.fonts.load)document.fonts.load('2.15rem Sacramento').then(centrarLogo,function(){});
    if(document.fonts.ready)document.fonts.ready.then(centrarLogo);
  }
}
</script>
