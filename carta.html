<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestra Carta · Café Tramuntana</title>
<meta name="description" content="Carta de Café Tramuntana en Ibi: desliza entre cafés, tapas, bocadillos, cervezas y copas.">
<meta name="theme-color" content="#F7F7F4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=Sacramento&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#F7F7F4; --espresso:#FFFFFF; --roast:#DCD9D1; --nogal:#2B1D14;
  --copper:#F5C451; --copper-soft:#8B5A2B;
  --cream:#2B1D14; --foam:#5E4E42; --foam-hi:#5E4E42;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Instrument Sans',system-ui,sans-serif;
  --script:'Sacramento','Brush Script MT',cursive;
  --cw:min(88vw,430px);           /* ancho de cada tarjeta */
  --gap:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(rgba(247,247,244,.55),rgba(247,247,244,.55)),url(fondo-carta.jpg) center top/300px 300px repeat,var(--ink);
  color:var(--cream);font-family:var(--sans);font-size:.94rem;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #8B5A2B;outline-offset:3px}

/* ---------- Barra superior ---------- */
.bar{flex:none;position:relative;z-index:8;background:rgba(247,247,244,.9);padding:calc(1.45rem + env(safe-area-inset-top)) 1rem .6rem;display:grid;grid-template-columns:2.5rem 1fr 2.5rem;align-items:center}
.icon-btn{width:2.5rem;height:2.5rem;display:grid;place-items:center;border-radius:50%;text-decoration:none;color:var(--foam);background:rgba(255,255,255,.7);border:1px solid var(--roast);transition:color .2s,border-color .2s}
.icon-btn:hover{color:var(--cream);border-color:var(--copper-soft)}
.icon-btn svg{width:20px;height:20px}

.count{justify-self:end;font-size:.76rem;font-weight:600;color:var(--foam);font-variant-numeric:tabular-nums}

/* Segmentos de categorías (se pueden pulsar) */
.segments{flex:none;display:flex;gap:5px;padding:0 1rem .7rem}
.seg{flex:1;height:22px;display:flex;align-items:center;background:none;border:0;cursor:pointer;padding:0}
.seg span{display:block;width:100%;height:3px;border-radius:3px;background:var(--roast);position:relative;overflow:hidden}
.seg span::after{content:"";position:absolute;inset:0;background:var(--copper);transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
.seg.done span::after,.seg.on span::after{transform:scaleX(1)}
.seg.on span::after{background:#FFD978}

/* ---------- Carrusel horizontal: categorías ---------- */
.deck{
  flex:1;min-height:0;display:flex;gap:var(--gap);
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior-x:contain;
  padding:0 calc((100% - var(--cw)) / 2) calc(.9rem + env(safe-area-inset-bottom));
  scrollbar-width:none;
}
.deck::-webkit-scrollbar{display:none}

.card{
  position:relative;flex:0 0 var(--cw);height:100%;
  scroll-snap-align:center;scroll-snap-stop:always;
  overflow:hidden;background:var(--espresso);border:1px solid var(--roast);border-radius:12px;
  box-shadow:0 24px 60px rgba(43,29,20,.16);
  transform:scale(.93);
  transition:transform .45s cubic-bezier(.2,.7,.2,1),border-color .45s;
}
/* Las tarjetas laterales se apagan con un velo (no con transparencia, para que el fondo no se cuele) */
.card::before{content:"";position:absolute;inset:0;z-index:6;background:rgba(247,247,244,.62);pointer-events:none;transition:opacity .45s ease}
.card.is-active{transform:none;border-color:rgba(233,169,44,.45)}
.card.is-active::before{opacity:0}

/* ---------- Pila vertical: apartados de cada categoría ---------- */
.stack{
  height:100%;overflow-y:auto;overflow-x:hidden;
  scroll-snap-type:y mandatory;scroll-behavior:smooth;overscroll-behavior-y:contain;
  scrollbar-width:none;
}
.stack::-webkit-scrollbar{display:none}
.page{min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;position:relative}
.page + .page{border-top:1px solid var(--roast)}

/* Primera pantalla: foto + título de la categoría */
.hero{flex:none;position:relative;height:30%;min-height:150px;max-height:260px;background:linear-gradient(135deg,var(--roast),var(--ink))}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(247,247,244,.05) 25%,rgba(255,255,255,.97) 100%)}
.hero-title{position:absolute;left:1.25rem;right:2.4rem;bottom:.8rem;z-index:1}
.when{display:inline-block;font-size:.7rem;font-weight:600;color:var(--nogal);background:var(--copper);padding:.18rem .6rem;border-radius:99px;margin-bottom:.4rem}
.hero-title h2{font-family:var(--serif);font-weight:700;font-size:clamp(1.6rem,7.5vw,2.1rem);line-height:1.05}

.page-body{flex:1;display:flex;flex-direction:column;padding:1rem 2.4rem 1rem 1.25rem}
.page-head{margin-bottom:.9rem}
.page-head small{display:block;color:var(--foam);font-size:.76rem;margin-bottom:.1rem}
.page-head h3{font-family:var(--serif);font-style:italic;font-weight:500;color:var(--copper-soft);font-size:1.45rem;line-height:1.15}
.page:not(.page-first) .page-head{padding-top:.6rem}
.page:not(.page-first) .page-head h3{font-style:normal;font-weight:700;color:var(--cream);font-size:clamp(1.7rem,7.5vw,2.1rem)}
.lead{color:var(--foam-hi);font-size:.8rem;margin:-.4rem 0 .9rem}

/* Productos */
.items{list-style:none;display:grid;gap:.85rem}
.item-head{display:flex;align-items:baseline;gap:.45rem}
.item-name{font-weight:600;font-size:.92rem;line-height:1.3}
.dots{flex:1;min-width:.75rem;border-bottom:1.5px dotted rgba(139,90,43,.45);transform:translateY(-.25rem)}
.price{font-family:var(--sans);font-weight:600;font-size:1rem;color:var(--copper-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.desc{color:var(--foam-hi);font-size:.79rem;line-height:1.45;margin-top:.12rem}
.is-star{border:1px solid var(--copper);border-radius:16px;padding:.75rem .85rem;margin:0 -.2rem;background:radial-gradient(circle at 100% 0%,rgba(233,169,44,.22),transparent 60%)}
.star-tag{display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:600;color:var(--copper-soft);margin-bottom:.2rem}
.star-tag svg{width:12px;height:12px}
.is-star .item-name{font-family:var(--serif);font-size:1.08rem}
.is-star .dots{display:none}
.is-star .item-head{justify-content:space-between}
.is-star .price{font-size:1.15rem}

/* Pista inferior de cada pantalla */
.cue{margin-top:auto;padding-top:1rem}
.cue-down{display:flex;align-items:center;justify-content:center;gap:.45rem;width:100%;background:none;border:0;cursor:pointer;color:var(--foam);font-size:.8rem;font-weight:500;padding:.4rem 0}
.cue-down strong{color:var(--cream);font-weight:600}
.cue-down svg{width:18px;height:18px;color:var(--copper-soft);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
.cue-next{width:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.85rem 1rem;border-radius:16px;border:1px dashed rgba(233,169,44,.55);background:none;cursor:pointer;text-align:left;transition:background .2s,border-color .2s}
.cue-next:hover{background:rgba(233,169,44,.1);border-color:var(--copper)}
.cue-next small{display:block;color:var(--foam);font-size:.72rem}
.cue-next strong{font-family:var(--serif);font-size:1.05rem}
.cue-next svg{width:22px;height:22px;color:var(--copper-soft);flex:none}
.legal{margin-top:.9rem;color:var(--foam);font-size:.72rem}
.legal a{color:var(--foam-hi)}

/* Indicador vertical de apartados (como en TikTok) */
.pdots{position:absolute;right:.7rem;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:7px}
.pdots button{width:8px;height:8px;padding:0;border:0;border-radius:99px;background:rgba(43,29,20,.2);cursor:pointer;transition:height .3s,background .3s}
.pdots button.on{height:22px;background:#FFD978}
.pdots:has(button:only-child){display:none}

/* ---------- Pista de uso (primera visita) ---------- */
.hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;display:grid;gap:.5rem;padding:.9rem 1.25rem;border-radius:18px;background:rgba(247,247,244,.96);border:1px solid var(--copper);box-shadow:0 10px 30px rgba(43,29,20,.22);font-size:.88rem;font-weight:500;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .4s}
.hint.show{opacity:1}
.hint div{display:flex;align-items:center;gap:.55rem}
.hint svg{width:20px;height:20px;color:var(--copper-soft);flex:none}

/* ---------- Flechas (solo con ratón) ---------- */
.arrow{display:none}
@media (hover:hover) and (pointer:fine) and (min-width:700px){
  .arrow{display:grid;place-items:center;position:fixed;top:55%;z-index:15;width:3rem;height:3rem;border-radius:50%;border:1px solid var(--roast);background:rgba(255,255,255,.9);color:var(--cream);cursor:pointer;transition:background .2s,opacity .2s}
  .arrow:hover{background:var(--copper);color:var(--nogal)}
  .arrow:disabled{opacity:0;pointer-events:none}
  .arrow svg{width:22px;height:22px}
  .arrow.prev{left:calc(50% - var(--cw)/2 - 4.2rem)}
  .arrow.next{right:calc(50% - var(--cw)/2 - 4.2rem)}
}

@media (prefers-reduced-motion:reduce){
  .deck,.stack{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
}

/* Nombre del local como el neón de la pared */
.brand,.neon{font-family:var(--script);font-weight:400;color:#E9A92C;text-shadow:0 0 1px #fff7da,0 0 6px rgba(255,176,46,.9),0 0 18px rgba(255,176,46,.55),0 0 36px rgba(255,176,46,.35)}

/* ===================== Letrero colgado (igual que en la portada, en pequeño) ===================== */
.colgante{position:relative;justify-self:center;animation:caer 1.3s .1s both}
.pendulo{position:relative;transform-origin:50% -1.7rem;animation:balanceo 2.8s .1s both}
.hilo{position:absolute;bottom:calc(100% + 8px);width:1.5px;height:140px;border-radius:1px;background:linear-gradient(90deg,#8d867d,#4a4038 55%,#2b1d14);box-shadow:1px 0 2px rgba(43,29,20,.25)}
.hilo-i{left:calc(.7rem + 3px)}.hilo-d{right:calc(.7rem + 3px)}
.panel{position:relative;padding:.716rem 1.99rem .035rem .74rem;border-radius:10px;
  background:linear-gradient(140deg,rgba(255,255,255,.75),rgba(255,255,255,.22) 55%,rgba(43,29,20,.07));
  border:1px solid rgba(43,29,20,.22);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),inset 0 1px 4px rgba(255,255,255,.65),
    0 2px 0 #cdc8be,0 3px 1px rgba(43,29,20,.3),0 6px 9px -3px rgba(43,29,20,.3),9px 16px 22px -9px rgba(43,29,20,.32)}
.panel::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(112deg,transparent 22%,rgba(255,255,255,.5) 30%,rgba(255,255,255,.08) 38%,transparent 44%)}
/* Tubo de neón: núcleo claro, borde ámbar, halo y sombra sobre el panel */
.bar .brand{position:relative;margin:0;font-family:var(--script);font-size:2.15rem;line-height:1;text-align:center;
  color:#ffe39a;-webkit-text-stroke:.022em #f39a12;paint-order:stroke fill;
  text-shadow:0 0 2px rgba(255,214,120,.9),0 0 6px rgba(255,176,46,.75),0 0 12px rgba(255,176,46,.28),2px 5px 4px rgba(43,29,20,.32);
  animation:parpadeo 2.1s 1.1s both}
.madera{position:absolute;top:-17px;z-index:4;width:10px;height:29px;overflow:visible;pointer-events:none;
  filter:drop-shadow(1.5px 3px 2px rgba(43,29,20,.5)) drop-shadow(0 1px 0 rgba(43,29,20,.3))}
.madera.mi{left:calc(.7rem - 2px)}.madera.md{right:calc(.7rem - 2px)}
@keyframes caer{
  0%{transform:translateY(-130px);animation-timing-function:cubic-bezier(.5,0,.9,.6)}
  52%{transform:translateY(0);animation-timing-function:ease-out}
  66%{transform:translateY(-7px);animation-timing-function:ease-in}
  78%{transform:translateY(0);animation-timing-function:ease-out}
  88%{transform:translateY(-1.5px);animation-timing-function:ease-in-out}
  100%{transform:translateY(0)}
}
@keyframes balanceo{
  0%{transform:rotate(-4deg)}20%{transform:rotate(3deg)}40%{transform:rotate(-2.4deg)}
  55%{transform:rotate(1.8deg)}70%{transform:rotate(-1.1deg)}83%{transform:rotate(.6deg)}93%{transform:rotate(-.2deg)}100%{transform:rotate(0)}
}
@keyframes parpadeo{
  0%,7%,14%,21%,29%,36%{color:#e9e4d6;-webkit-text-stroke-color:#bdb5a2;text-shadow:2px 5px 4px rgba(43,29,20,.3)}
  9%,12%{color:#ffeab0;-webkit-text-stroke-color:#d49a3a;text-shadow:0 0 4px rgba(255,176,46,.7),2px 5px 4px rgba(43,29,20,.3)}
  23%,27%,64%,67%{color:#ffe7a8;-webkit-text-stroke-color:#e89a22;text-shadow:0 0 2px rgba(255,214,120,.75),0 0 8px rgba(255,176,46,.4),2px 5px 4px rgba(43,29,20,.32)}
  38%,60%,70%,100%{color:#ffe39a;-webkit-text-stroke-color:#f39a12;text-shadow:0 0 2px rgba(255,214,120,.9),0 0 6px rgba(255,176,46,.75),0 0 12px rgba(255,176,46,.28),2px 5px 4px rgba(43,29,20,.32)}
}

/* ===================== Tarjetas: canto de metacrilato y luz de neón ===================== */
.card{border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),0 3px 0 #cdc8be,0 8px 12px -4px rgba(43,29,20,.3)}
.is-star{border:2px solid #f39a12;box-shadow:inset 0 0 0 1px #ffe39a,0 0 0 1px rgba(255,214,120,.45),0 0 10px rgba(255,176,46,.4)}
.seg.on span::after{background:#f39a12;box-shadow:0 0 7px rgba(255,176,46,.9)}
.pdots button.on{background:#f39a12;box-shadow:0 0 6px rgba(255,176,46,.85)}
</style>
<script>
/* Fotos: busca img/cat-<nombre> en jpg, png, jpeg o webp; si no hay, usa la de ejemplo */
var TR_EXT=['jpg','png','jpeg','webp','JPG','PNG','JPEG'];
function trImg(el,name,fallback){
  if(!el._t){var f=el.getAttribute('src'),l=[];TR_EXT.forEach(function(e){var p='img/'+name+'.'+e;if(p!==f)l.push(p)});el._t=l;el._i=0}
  if(el._i<el._t.length)el.src=el._t[el._i++];
  else if(fallback){el.onerror=function(){el.remove()};el.src=fallback;fallback=null}
  else el.remove();
}
</script>

<main class="deck" id="deck" aria-roledescription="carrusel" aria-label="Carta"></main>

<button class="arrow prev" id="prev" type="button" aria-label="Categoría anterior">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</button>
<button class="arrow next" id="next" type="button" aria-label="Categoría siguiente">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
</button>

<div class="hint" id="hint" aria-hidden="true">
  <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M7 9l5-5 5 5M7 15l5 5 5-5"/></svg>Arriba y abajo: apartados</div>
  <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg>A los lados: categorías</div>
</div>

<script>
/* =====================================================================
   CARTA · edita aquí categorías, apartados, productos y precios.
   - Cada categoría es una tarjeta (se cambia deslizando a los lados).
   - Cada apartado ("groups") es una pantalla (se cambia deslizando arriba/abajo).
   - Producto: ['Nombre','Precio','Descripción']  ·  añade true al final
     para marcarlo como "La estrella de la casa".
   - OJO: si hay una hoja de Google configurada en carta-datos.js, la carta sale
     de ella y esto solo se usa como copia de seguridad.
   - id: sirve para el enlace (carta.html#cervezas) y para la foto
     (img/cat-cervezas.jpg).
   ===================================================================== */
var MENU=[
  {id:'cafes',title:'Cafés & Desayunos',when:'Desde las 8:30',
   photo:'https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=900&q=70',
   lead:'Café de tueste artesano. Leche sin lactosa o bebida vegetal, consúltanos.',
   groups:[
    {name:'Cafés',items:[
      ['Café Bombón','2,00 €','Espresso con leche condensada, dulce y con mucho cuerpo.',true],
      ['Café solo / cortado','1,50 €','Espresso intenso, con un toque de leche si lo prefieres.'],
      ['Café con leche','1,70 €','El clásico de cada mañana, cremoso y bien caliente.'],
      ['Capuchino','2,30 €','Espresso, leche vaporizada y espuma sedosa con cacao.'],
      ['Carajillo','2,60 €','Café con un chorrito de licor: brandy, whisky o ron.'],
      ['Chocolate a la taza','2,80 €','Espeso y casero, perfecto para mojar.']]},
    {name:'Desayunos',items:[
      ['Desayuno Tramuntana','5,50 €','Café, zumo de naranja natural y tostada a elegir.',true],
      ['Tostada con tomate y aceite','2,00 €','Pan crujiente, tomate rallado y aceite de oliva virgen extra.'],
      ['Tostada de Jamón Ibérico y Tomate','4,50 €','Jamón ibérico cortado a cuchillo sobre pan de masa madre.'],
      ['Tostada de Aguacate y Huevo','4,80 €','Aguacate, huevo poché y un toque de pimienta y limón.'],
      ['Croissant a la plancha','2,20 €','Con mantequilla y mermelada, o relleno de jamón y queso (+0,80 €).']]}
   ]},
  {id:'tapas',title:'Tapas & Picoteo',when:'Para compartir',
   photo:'https://images.unsplash.com/photo-1515443961218-a51367888e4b?auto=format&fit=crop&w=900&q=70',
   lead:'Pregunta por las tapas del día.',
   groups:[
    {name:'Tapas clásicas',items:[
      ['Croquetas caseras (6 uds.)','7,00 €','De jamón ibérico, cremosas por dentro y crujientes por fuera.',true],
      ['Patatas bravas','5,50 €','Fritas al momento con salsa brava casera y alioli suave.'],
      ['Calamares a la andaluza','9,00 €','Rebozado fino, con limón y alioli.'],
      ['Ensaladilla rusa','5,50 €','Receta de siempre con atún, huevo y aceitunas.'],
      ['Pimientos de padrón','6,00 €','Salteados con sal en escamas. Unos pican y otros no.']]},
    {name:'Para compartir',items:[
      ['Tabla de ibéricos','13,50 €','Jamón, lomo y chorizo ibéricos con picos y tomate.',true],
      ['Tabla de quesos','12,50 €','Selección de quesos curados con frutos secos y mermelada.'],
      ['Nachos Tramuntana','8,50 €','Con queso fundido, guacamole, pico de gallo y jalapeños.']]}
   ]},
  {id:'bocadillos',title:'Bocadillos & Sándwiches',when:'Mediodía y noche',
   photo:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=900&q=70',
   lead:'Con patatas fritas caseras (salvo los sándwiches fríos).',
   groups:[
    {name:'Bocadillos',items:[
      ['Bocadillo de lomo con queso','5,50 €','Lomo a la plancha, queso fundido y pimiento verde.',true],
      ['Bocadillo de jamón ibérico','6,50 €','Pan de cristal con tomate y aceite de oliva.'],
      ['Bocadillo de tortilla de patata','4,50 €','Tortilla jugosa y casera, con o sin cebolla.'],
      ['Pollo crujiente','7,50 €','Pechuga rebozada, lechuga, tomate y mayonesa de mostaza.']]},
    {name:'Hamburguesas & Sándwiches',items:[
      ['Hamburguesa Tramuntana','9,50 €','Ternera, queso curado, bacon crujiente, cebolla caramelizada y salsa de la casa.',true],
      ['Sándwich mixto a la plancha','3,50 €','Jamón cocido y queso, tostado hasta que queda dorado.'],
      ['Sándwich vegetal','4,50 €','Lechuga, tomate, huevo, atún, espárragos y mayonesa.']]}
   ]},
  {id:'cervezas',title:'Cervezas',when:'Al caer la tarde',
   photo:'https://images.unsplash.com/photo-1608270586620-248524c67de9?auto=format&fit=crop&w=900&q=70',
   lead:'Grifo, botella y artesanas de todo el mundo. Déjate aconsejar.',
   groups:[
    {name:'De grifo',items:[
      ['Caña','1,80 €','Rubia lager, fresca y ligera.'],
      ['Doble','2,60 €','La caña de siempre, en copa más grande.'],
      ['Clara / Shandy','2,00 €','Cerveza con limón o gaseosa.']]},
    {name:'Artesanas',items:[
      ['IPA Artesanal','4,50 €','Aromática y con carácter, notas cítricas y amargor marcado.',true],
      ['Pale Ale','4,20 €','Equilibrada, con toques de fruta tropical.'],
      ['Tostada / Stout','4,50 €','Notas de café y chocolate, cuerpo suave.']]},
    {name:'Botella y sin alcohol',items:[
      ['Tercio de cerveza','2,50 €','Pregúntanos por las marcas disponibles.'],
      ['Cerveza sin alcohol','2,50 €','Disponible también sin gluten, consúltanos.']]}
   ]},
  {id:'cocteles',title:'Coctelería & Copas',when:'De noche',
   photo:'https://images.unsplash.com/photo-1470337458703-46ad1756a187?auto=format&fit=crop&w=900&q=70',
   lead:'Preparados al momento, con hielo de calidad.',
   groups:[
    {name:'Cócteles',items:[
      ['Espresso Martini','8,00 €','Vodka, licor de café y espresso recién hecho. Del café a la copa.',true],
      ['Mojito','7,00 €','Ron blanco, hierbabuena, lima, azúcar y soda.'],
      ['Gin Tonic','7,50 €','Ginebra premium, tónica y un toque de cítricos o frutos rojos.'],
      ['Aperol Spritz','6,50 €','Aperol, prosecco, soda y una rodaja de naranja.'],
      ['Caipirinha','7,00 €','Cachaça, lima fresca y azúcar moreno.']]},
    {name:'Copas & Vinos',items:[
      ['Combinado nacional','6,00 €','Ron, ginebra, whisky o vodka con refresco a elegir.'],
      ['Copa de vino','2,80 €','Tinto, blanco o rosado. Pregunta por la selección de la semana.'],
      ['Tinto de verano','3,00 €','Vino tinto con gaseosa y limón, muy fresquito.'],
      ['Sangría (jarra)','12,00 €','Vino, frutas de temporada y un toque de licor.']]}
   ]}
];
</script>

<script>
function bootCarta(){
  var deck=document.getElementById('deck'),segs=document.getElementById('segments');
  var countEl=document.getElementById('count'),prevBtn=document.getElementById('prev'),nextBtn=document.getElementById('next');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var STAR='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>';
  var DOWN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  var RIGHT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

  function itemNode(it){
    var li=el('li',it[3]?'is-star':null);
    if(it[3]){var t=el('span','star-tag');t.innerHTML=STAR;t.appendChild(document.createTextNode('La estrella de la casa'));li.appendChild(t)}
    var h=el('div','item-head');h.appendChild(el('span','item-name',it[0]));h.appendChild(el('span','dots'));h.appendChild(el('span','price',it[1]));li.appendChild(h);
    if(it[2])li.appendChild(el('p','desc',it[2]));
    return li;
  }

  var cats=[];   /* {card,stack,pages,dots,page} */

  /* ---------- Construir tarjetas (categorías) y pantallas (apartados) ---------- */
  MENU.forEach(function(c,ci){
    var card=el('section','card');card.id=c.id;
    card.setAttribute('aria-label',c.title);
    var stack=el('div','stack');card.appendChild(stack);
    var dotsBox=el('div','pdots');card.appendChild(dotsBox);
    var state={card:card,stack:stack,pages:[],dots:[],page:0};

    c.groups.forEach(function(g,gi){
      var page=el('article','page'+(gi===0?' page-first':''));
      page.setAttribute('aria-label',c.title+': '+g.name);

      if(gi===0){
        var hero=el('div','hero');
        var img=el('img');img.alt='';img.decoding='async';img.loading=ci<2?'eager':'lazy';
        img.src='img/cat-'+c.id+'.jpg';
        (function(img,c){img.onerror=function(){trImg(img,'cat-'+c.id,c.photo)}})(img,c);
        hero.appendChild(img);
        var ht=el('div','hero-title');if(c.when)ht.appendChild(el('span','when',c.when));ht.appendChild(el('h2',null,c.title));
        hero.appendChild(ht);page.appendChild(hero);
      }

      var body=el('div','page-body');
      var head=el('div','page-head');
      if(gi>0)head.appendChild(el('small',null,c.title));
      head.appendChild(el('h3',null,g.name));
      body.appendChild(head);
      if(gi===0&&c.lead)body.appendChild(el('p','lead',c.lead));
      var ul=el('ul','items');g.items.forEach(function(it){ul.appendChild(itemNode(it))});body.appendChild(ul);

      var cue=el('div','cue');
      if(gi<c.groups.length-1){
        var d=el('button','cue-down');d.type='button';
        d.appendChild(document.createTextNode('Desliza para ver '));d.appendChild(el('strong',null,c.groups[gi+1].name));
        d.insertAdjacentHTML('beforeend',DOWN);
        d.addEventListener('click',function(){goPage(ci,gi+1)});
        cue.appendChild(d);
      }else if(ci<MENU.length-1){
        var n=el('button','cue-next');n.type='button';
        var w=el('span');w.appendChild(el('small',null,'Siguiente categoría'));w.appendChild(el('strong',null,MENU[ci+1].title));
        n.appendChild(w);n.insertAdjacentHTML('beforeend',RIGHT);
        n.addEventListener('click',function(){go(ci+1)});
        cue.appendChild(n);
      }else{
        var lg=el('p','legal');
        lg.innerHTML='Precios con IVA incluido. Si tienes alguna alergia o intolerancia, avisa a nuestro equipo antes de pedir. <a href="legal.html">Aviso legal</a> · <a href="#" data-cookie-settings>Cookies</a>';
        cue.appendChild(lg);
      }
      body.appendChild(cue);page.appendChild(body);stack.appendChild(page);state.pages.push(page);

      var dot=el('button');dot.type='button';dot.setAttribute('aria-label',g.name);
      dot.addEventListener('click',function(){goPage(ci,gi)});
      dotsBox.appendChild(dot);state.dots.push(dot);
    });

    /* Seguir en qué apartado está cada categoría */
    var r=0;
    stack.addEventListener('scroll',function(){
      if(r)return;r=requestAnimationFrame(function(){
        r=0;var top=stack.scrollTop+stack.clientHeight/2,p=0;
        state.pages.forEach(function(pg,k){if(pg.offsetTop<=top)p=k});
        setPage(ci,p);
      });
    },{passive:true});

    deck.appendChild(card);cats.push(state);setPage(ci,0,true);

    var b=el('button','seg');b.type='button';b.setAttribute('aria-label',c.title);
    b.appendChild(el('span'));b.addEventListener('click',function(){go(ci)});segs.appendChild(b);
  });

  var buttons=[].slice.call(segs.children),current=-1;

  /* ---------- Apartados (vertical) ---------- */
  function setPage(ci,p,force){
    var s=cats[ci];if(!force&&s.page===p)return;s.page=p;
    s.dots.forEach(function(d,k){d.classList.toggle('on',k===p);d.setAttribute('aria-current',k===p?'true':'false')});
    if(ci===current)updateCount();
  }
  function goPage(ci,p){
    var s=cats[ci];p=Math.max(0,Math.min(s.pages.length-1,p));
    s.stack.scrollTo({top:s.pages[p].offsetTop,behavior:reduce?'auto':'smooth'});
  }

  /* ---------- Categorías (horizontal) ---------- */
  function go(i,instant){
    i=Math.max(0,Math.min(cats.length-1,i));
    var c=cats[i].card;
    deck.scrollTo({left:c.offsetLeft-(deck.clientWidth-c.offsetWidth)/2,behavior:(instant||reduce)?'auto':'smooth'});
  }
  function updateCount(){
    var s=cats[current];
    countEl.textContent=(current+1)+' / '+cats.length;
    countEl.setAttribute('aria-label','Categoría '+(current+1)+' de '+cats.length+', apartado '+(s.page+1)+' de '+s.pages.length);
  }
  function setActive(i){
    if(i===current)return;current=i;
    cats.forEach(function(s,k){s.card.classList.toggle('is-active',k===i)});
    buttons.forEach(function(b,k){b.classList.toggle('on',k===i);b.classList.toggle('done',k<i);b.setAttribute('aria-current',k===i?'true':'false')});
    prevBtn.disabled=i===0;nextBtn.disabled=i===cats.length-1;
    updateCount();
    try{history.replaceState(null,'','#'+MENU[i].id)}catch(e){}
  }
  function nearest(){
    var mid=deck.scrollLeft+deck.clientWidth/2,best=0,bd=1e9;
    cats.forEach(function(s,k){var c=s.card,d=Math.abs(c.offsetLeft+c.offsetWidth/2-mid);if(d<bd){bd=d;best=k}});
    return best;
  }
  var raf=0;
  deck.addEventListener('scroll',function(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;setActive(nearest())})},{passive:true});
  window.addEventListener('resize',function(){go(current,true);cats.forEach(function(s,k){s.stack.scrollTop=s.pages[s.page].offsetTop})});

  /* ---------- Controles: flechas en pantalla y teclado ---------- */
  prevBtn.addEventListener('click',function(){go(current-1)});
  nextBtn.addEventListener('click',function(){go(current+1)});
  document.addEventListener('keydown',function(e){
    var s=cats[current];
    if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}
    else if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}
    else if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();goPage(current,s.page+1)}
    else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();goPage(current,s.page-1)}
  });

  /* ---------- Inicio: categoría del enlace, o según la hora ---------- */
  var start=0,hash=location.hash.replace('#','');
  MENU.forEach(function(c,k){if(c.id===hash)start=k});
  if(!hash&&new Date().getHours()>=19)MENU.forEach(function(c,k){if(c.id==='cervezas')start=k});   /* de noche abre en Cervezas */
  setActive(start);
  requestAnimationFrame(function(){go(start,true)});

  /* ---------- Cómo usar la carta ----------
     Se explica a quien aún no ha aceptado las cookies (primera visita, o las rechazó),
     una vez por visita. Quien ya las aceptó conoce la carta y no la ve. */
  function aceptoCookies(){
    try{var v=JSON.parse(localStorage.getItem('tramuntana-consent'));return !!(v&&v.date&&Date.now()-v.date<365*864e5&&v.analytics===true)}catch(e){return false}
  }
  var seen=false;try{seen=sessionStorage.getItem('tr-tiktok-hint')==='1'}catch(e){}
  if(!seen&&!aceptoCookies()){
    var hint=document.getElementById('hint');
    setTimeout(function(){
      hint.classList.add('show');
      if(!reduce){
        var st=cats[current].stack;
        if(st.animate&&cats[current].pages.length>1)st.animate([{transform:'translateY(0)'},{transform:'translateY(-44px)'},{transform:'translateY(0)'}],{duration:900,easing:'ease-in-out'});
        if(deck.animate&&current<cats.length-1)setTimeout(function(){deck.animate([{transform:'translateX(0)'},{transform:'translateX(-44px)'},{transform:'translateX(0)'}],{duration:900,easing:'ease-in-out'})},1000);
      }
    },800);
    var hide=function(){hint.classList.remove('show');try{sessionStorage.setItem('tr-tiktok-hint','1')}catch(e){}};
    setTimeout(hide,9000);
    /* desaparece en cuanto el visitante toca, desliza o pulsa una tecla */
    ['pointerdown','keydown','wheel'].forEach(function(ev){document.addEventListener(ev,function(){setTimeout(hide,250)},{once:true,passive:true})});
  }
}
</script>
<script src="carta-datos.js"></script>
<script src="cookies.js" defer></script>
</body>
</html>
